# ==========================================
# LLaMA-3 LoRA Fine-Tuning Configuration
# ==========================================

# --- Model Settings ---
model_id: "meta-llama/Llama-3.2-1B-Instruct"
device_map: "auto"
use_bf16: false
use_fp16: true

# --- LoRA Parameters ---
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - "q_proj"
  - "k_proj"
  - "v_proj"
  - "o_proj"
  - "gate_proj"
  - "up_proj"
  - "down_proj"

# --- Dataset Settings ---
# Can be Hugging Face Hub repo id (e.g. "theguywithblacktie/hinglish-conversations")
# or a local file path (e.g. "dataset/hf_export/small/train.parquet")
dataset_path: "theguywithblacktie/hinglish-conversations"
dataset_config: "small"  # Options: "small" (50k) or "large" (405k)
system_prompt: "You are a helpful, friendly, and culturally attuned AI assistant. You converse naturally in Romanized Hinglish (Hindi code-mixed with English in Latin script). Keep your tone warm, relatable, and clear, using everyday vocabulary, expressions, and context appropriate for Indian conversations while providing accurate and helpful responses."
test_size: 0.1
seed: 42
max_samples: null  # Set to null for full split, or an integer (e.g., 5000) for testing

# --- Training / SFTTrainer Settings ---
output_dir: "./llama3-lora-outputs"
push_to_hub: true
hub_model_id: "theguywithblacktie/llama-3.2-1b-hinglish-lora"
epochs: 1
batch_size: 4
gradient_accumulation_steps: 4
gradient_checkpointing: false
learning_rate: 0.0002
optim: "adamw_torch"
max_seq_length: 512
logging_steps: 10
eval_steps: 500
save_steps: 50

# --- Inference Settings ---
max_new_tokens: 512
temperature: 0.7
top_p: 0.9
