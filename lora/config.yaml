# ==========================================
# Mistral-7B LoRA / QLoRA Fine-Tuning Configuration
# Optimized for Kaggle P100 GPU (16GB VRAM, Pascal)
# ==========================================

# --- Model Settings ---
model_id: "mistralai/Mistral-7B-Instruct-v0.3"
device_map: "auto"
use_4bit: true             # 4-bit QLoRA to fit comfortably in ~5.5GB VRAM
use_fp16: true             # P100 supports FP16 natively (does NOT support BF16)
use_bf16: false

# --- LoRA Parameters ---
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - "q_proj"
  - "k_proj"
  - "v_proj"
  - "o_proj"
  - "gate_proj"
  - "up_proj"
  - "down_proj"

# --- Dataset Settings ---
dataset_path: "theguywithblacktie/medical-cot"
local_dataset_path_fallback: "dataset/hf_export/medical_cot"
experiment_mode: "cot" # Options: "cot", "direct", "weighted_cot"
test_size: 0.1
seed: 42
max_samples: null
max_eval_samples: 200

# --- Training / SFTTrainer Settings ---
output_dir: "./mistral-lora-outputs"
resume_from_checkpoint: null
push_to_hub: true
hub_model_id: "theguywithblacktie/mistral-7b-instruct-medical-cot-lora"
epochs: 2
batch_size: 2
gradient_accumulation_steps: 8
gradient_checkpointing: true
learning_rate: 0.0002
optim: "paged_adamw_8bit"
max_seq_length: 2048
logging_steps: 10
eval_steps: 500
save_steps: 500
save_total_limit: 2
use_completion_masking: true
response_template: "[/INST]"

# --- Loss Weighting Settings ---
loss_weighting:
  enabled: false
  think_tag_weight: 0.25
  reasoning_weight: 0.50
  end_think_tag_weight: 0.75
  answer_weight: 1.00

# --- Inference Settings ---
max_new_tokens: 512
temperature: 0.4
top_p: 0.9
repetition_penalty: 1.05
