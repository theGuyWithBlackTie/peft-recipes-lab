# ==========================================
# LLaMA-3 LoRA Fine-Tuning Configuration
# ==========================================

# --- Model Settings ---
model_id: "meta-llama/Llama-3.2-1B-Instruct"
device_map: "auto"
use_bf16: true
use_fp16: false

# --- LoRA Parameters ---
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - "q_proj"
  - "k_proj"
  - "v_proj"
  - "o_proj"
  - "gate_proj"
  - "up_proj"
  - "down_proj"

# --- Dataset Settings ---
dataset_path: "dataset/hinglish_dataset_.csv"
test_size: 0.1
seed: 42
max_samples: 1000  # Set to null or a number to limit training samples

# --- Training / SFTTrainer Settings ---
output_dir: "./llama3-lora-outputs"
epochs: 1
batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 0.0002
optim: "adamw_torch"
max_seq_length: 2048
logging_steps: 10
eval_steps: 500
save_steps: 50

# --- Inference Settings ---
max_new_tokens: 512
temperature: 0.7
top_p: 0.9
