# ==========================================
# Mistral-7B LoRA / QLoRA Fine-Tuning Configuration
# Optimized for Kaggle P100 GPU (16GB VRAM, Pascal)
# ==========================================

# --- Model Settings ---
model_id: "mistralai/Mistral-7B-Instruct-v0.3"
device_map: "auto"
use_4bit: true             # 4-bit QLoRA to fit comfortably in ~5.5GB VRAM
use_fp16: true             # P100 supports FP16 natively (does NOT support BF16)
use_bf16: false

# --- LoRA Parameters ---
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - "q_proj"
  - "k_proj"
  - "v_proj"
  - "o_proj"
  - "gate_proj"
  - "up_proj"
  - "down_proj"

# --- Dataset Settings ---
dataset_path: "theguywithblacktie/hinglish-conversations"
dataset_config: "small"  # Options: "small" (50k) or "large" (405k)
system_prompt: "You are a helpful, friendly, and culturally attuned AI assistant. You converse naturally in Romanized Hinglish (Hindi code-mixed with English in Latin script). Keep your tone warm, relatable, and clear, using everyday vocabulary, expressions, and context appropriate for Indian conversations while providing accurate and helpful responses."
test_size: 0.1
seed: 42
max_samples: null  # Set to null for full split, or an integer (e.g., 5000) for testing

# --- Training / SFTTrainer Settings ---
output_dir: "./mistral-lora-outputs"
push_to_hub: true
hub_model_id: "theguywithblacktie/mistral-7b-instruct-hinglish-lora"
epochs: 2
batch_size: 2
gradient_accumulation_steps: 8
gradient_checkpointing: true
learning_rate: 0.0002
optim: "paged_adamw_8bit"
max_seq_length: 1024
logging_steps: 10
eval_steps: 500
save_steps: 500
save_total_limit: 2
use_completion_masking: true
response_template: "[/INST]"

# --- Inference Settings ---
max_new_tokens: 512
temperature: 0.4
top_p: 0.9
repetition_penalty: 1.05
